name: Pruebas Python y arranque Linux
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.9'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=pytest-linux.xml
      - run: node --check static/app.js && node tests/check_frontend.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-pruebas-linux
          path: pytest-linux.xml
